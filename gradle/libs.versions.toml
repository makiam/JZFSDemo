[versions]
junit = "6.1.3"

[libraries]
lombok = { module = "org.projectlombok:lombok", version = "1.18.48"}

rsta = { module = "com.fifesoft:rsyntaxtextarea", version = "4.0.1" }
groovy = { module = "org.apache.groovy:groovy", version = "5.1.2" }

logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.6.3" }
slf-api = { module = "org.slf4j:slf4j-api", version = "2.0.19" }

jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit = { module = "org.junit.platform:junit-platform-suite", version.ref = "junit" }
jemmy = { module = "org.netbeans:jemmy", version = "2.2.7.5"}

jackson = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version = "2.18.2" }
[bundles]

logging = ["logback-classic", "slf-api"]
testing = ["jupiter", "junit", "jemmy"]